<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#658d44" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HomeHub" />
    <!-- The on-device Whisper engine is a prebuilt bundle that imports the ONNX
         runtime by BARE specifier. A bundler cannot resolve those, so they are
         mapped here to the vendored copies instead of a CDN. Without this the
         import fails outright with "Failed to resolve module specifier
         onnxruntime-web/webgpu" and voice input never starts. Paths are
         absolute because they must resolve from any route, not just "/". -->
    <script type="importmap">
      {
        "imports": {
          "onnxruntime-web/webgpu": "/whisper/vendor/ort/ort.webgpu.bundle.min.mjs",
          "onnxruntime-common": "/whisper/vendor/ort/ort.bundle.min.mjs"
        }
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="HomeHub — simple household management for groceries and kitchen stock." />
    <title>HomeHub — Household Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
